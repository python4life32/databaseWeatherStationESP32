<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Teste base de dados ESP32</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .pop {transition: 0.2s ease-in-out;}
        .pop:hover { transform:scale(1.05); }
    </style>
  </head>
  <body>
    <div class="container">
        <div class="h1 text-center m-4">Teste base de dados ESP32</div>
    </div>
    <div class="container-fluid px-2 px-sm-5">
        <div class="row row-cols-lg-2 row-cols-1 justify-content-evenly align-items-center g-5">
            <div class="col">
                <div class="card shadow border pop">
                    <div class="row ms-3 mt-3 align-items-center row-cols-auto">
                        <div class="col h3 g-0">Temperatura: </div>
                        <div id="temp" class="col h2 text-info-emphasis">Loading data...</div>
                    </div>
                    <iframe class="card border shadow mx-1 mb-1 mx-sm-3 mb-sm-3" src="https://thingspeak.com/channels/3448684/charts/1?bgcolor=%23ffffff&color=%23d62020&dynamic=false&results=60&title=Temperature+Chart&type=line&width=auto&height=170&update=30"></iframe>
                </div>
            </div>
            <div class="col">
                <div class="card shadow border pop">
                    <div class="row ms-3 mt-3 align-items-center row-cols-auto">
                        <div class="col h3 g-0">Humidade: </div>
                        <div id="hum" class="col h2 text-info-emphasis">Loading data...</div>
                    </div>
                    <iframe class="card border shadow mb-1 mx-1 mx-sm-3 mb-sm-3" src="https://thingspeak.com/channels/3448684/charts/2?bgcolor=%23ffffff&color=%23d62020&dynamic=false&results=60&title=Humidity+Chart&type=line&width=auto&height=170&update=30"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        async function fetchdata() {
            try{
                const response = await fetch("https://weatherstation-346e2-default-rtdb.europe-west1.firebasedatabase.app/.json");

                if (!response.ok){
                    throw new Error(`HTTP Error Status: ${response.status}`);
                }
                const data = await response.json();
                document.getElementById("temp").textContent= `${data.temp}°C`;
                document.getElementById("hum").textContent = `${data.hum}%`;
                
                if (data.active === true){
                    console.log("System operational");
                }   

            }catch(error){
                console.log("Data fetch failed: "+error);
            }finally{
                console.log("Operation finished.");
            }
        }
        fetchdata();
        setInterval(fetchdata, 5000)
    </script>
  </body>
</html>
